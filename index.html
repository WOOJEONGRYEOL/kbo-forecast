<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT 베이스볼</title>
<style>
  :root { --bg:#10141c; --card:#1a212e; --line:#2a3345; --text:#e8ecf3; --muted:#8a94a8; --green:#3ecf8e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:22px; padding:40px 20px; background:var(--bg); color:var(--text);
    font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif; word-break:keep-all; }
  h1 { font-size:26px; margin:0; text-align:center; word-break:keep-all; line-height:1.25; }
  .brand { margin:0; width:100%; text-align:center; font-weight:800; letter-spacing:.5px;
    font-size:clamp(28px, 8vw, 38px); }
  .wordmark { display:block; width:100%; max-width:380px; height:auto; margin:0 auto; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .subtitle { color:var(--green); font-size:19px; font-weight:800; text-align:center; margin:0;
    letter-spacing:.2px; word-break:keep-all; }
  .cyc { display:inline-block; width:30px; text-align:center; font-size:23px; vertical-align:-4px;
    margin-right:2px; transition:opacity .22s ease, transform .22s ease; }
  .tag { color:var(--green); font-size:17px; letter-spacing:.3px; text-align:center; margin-top:4px;
    font-weight:600; word-break:keep-all; line-height:1.5; }
  .tag .cl { display:inline-block; white-space:nowrap; }
  .tag-bottom { font-size:15px; opacity:.8; margin:0; }
  .byline { display:inline-block; margin:0; padding:5px 15px; border:1px solid rgba(62,207,142,.38);
    border-radius:999px; background:rgba(62,207,142,.12); color:#eaf8f0; font-size:14px;
    font-weight:700; letter-spacing:.2px; }
  .sub { color:var(--muted); font-size:13px; text-align:center; margin-top:-2px; word-break:keep-all; }
  @media (max-width:480px){ h1{ font-size:20px; } body{ padding:28px 16px; } }
  .cards { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; max-width:660px; }
  a.card { text-decoration:none; color:var(--text); background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:18px 20px; width:200px; transition:.15s;
    display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; }
  a.card:hover { border-color:var(--green); transform:translateY(-3px); }
  a.card .ico { line-height:0; }
  a.card .ico svg { width:36px; height:36px; display:block; fill:none; stroke:var(--green);
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  a.card .ico svg .fill { fill:var(--green); stroke:none; }
  a.card h2 { font-size:16.5px; margin:0; }
  .foot { color:var(--muted); font-size:12px; text-align:center; line-height:1.7; max-width:640px; }
  .foot b { color:#aab3c5; font-weight:600; }
</style>
</head>
<body>
  <h1 class="brand" aria-label="GPT 베이스볼">
    <span class="sr-only">GPT 베이스볼</span>
    <svg class="wordmark" viewBox="0 70 285 62" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <text x="12" y="118" text-anchor="start" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="800" font-size="46" fill="#e8ecf3">GPT 베</text>
      <defs>
        <radialGradient id="bball" cx="38%" cy="33%" r="72%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="60%" stop-color="#f3f0e7"/>
          <stop offset="100%" stop-color="#dbd5c3"/>
        </radialGradient>
      </defs>
      <g transform="translate(164,97)">
        <circle r="15" fill="url(#bball)" stroke="#bcb6a0" stroke-width="0.8"/>
        <path d="M -5,-13.7 Q -9,0 -5,13.7" fill="none" stroke="#c0392b" stroke-width="1.1"/>
        <path d="M 5,-13.7 Q 9,0 5,13.7" fill="none" stroke="#c0392b" stroke-width="1.1"/>
        <g stroke="#c0392b" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M -7.9,-11.2 L -4.4,-9.6 L -7.9,-8.0"/>
          <path d="M -8.7,-6.5 L -5.2,-4.9 L -8.7,-3.3"/>
          <path d="M -9,-1.6 L -5.5,0 L -9,1.6"/>
          <path d="M -8.7,3.3 L -5.2,4.9 L -8.7,6.5"/>
          <path d="M -7.9,8.0 L -4.4,9.6 L -7.9,11.2"/>
          <path d="M 7.9,-11.2 L 4.4,-9.6 L 7.9,-8.0"/>
          <path d="M 8.7,-6.5 L 5.2,-4.9 L 8.7,-3.3"/>
          <path d="M 9,-1.6 L 5.5,0 L 9,1.6"/>
          <path d="M 8.7,3.3 L 5.2,4.9 L 8.7,6.5"/>
          <path d="M 7.9,8.0 L 4.4,9.6 L 7.9,11.2"/>
        </g>
        <ellipse cx="-2.7" cy="-1" rx="2.3" ry="3.15" fill="#ffffff" stroke="#cfcabb" stroke-width="0.4"/>
        <ellipse cx="2.7" cy="-1" rx="2.3" ry="3.15" fill="#ffffff" stroke="#cfcabb" stroke-width="0.4"/>
        <circle cx="-2.3" cy="0.2" r="1.5" fill="#1b1b1b"/>
        <circle cx="3.1" cy="0.2" r="1.5" fill="#1b1b1b"/>
        <circle cx="-2.75" cy="-0.5" r="0.45" fill="#ffffff"/>
        <circle cx="2.65" cy="-0.5" r="0.45" fill="#ffffff"/>
      </g>
      <line x1="184" y1="79" x2="184" y2="118" stroke="#e8ecf3" stroke-width="7" stroke-linecap="round"/>
      <text x="191" y="118" text-anchor="start" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="800" font-size="46" fill="#e8ecf3">스볼</text>
    </svg>
  </h1>
  <div class="subtitle"><span id="cyc" class="cyc" aria-hidden="true">🍗</span> 치맥 들고 방구석 머니볼</div>
  <div class="byline">Cooked by 야구우~ 부장</div>
  <div class="sub"><span id="lastUpdated"></span></div>
  <div class="cards">
    <a class="card" href="data/dashboard.html">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="11" rx="1"/><rect x="16" y="5" width="4" height="15" rx="1"/></svg></div>
      <h2>팀 단기 전력</h2>
    </a>
    <a class="card" href="data/players.html">
      <div class="ico"><svg viewBox="0 0 24 24"><polygon points="12,3 20.5,9.2 17.2,19.2 6.8,19.2 3.5,9.2"/><circle class="fill" cx="12" cy="12.4" r="1.5"/></svg></div>
      <h2>선수 평가</h2>
    </a>
    <a class="card" href="data/title_race.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M6 3 V21"/><path d="M6 4.5 H19 V13.5 H6"/><g class="fill"><rect x="6" y="4.5" width="3.25" height="3"/><rect x="12.5" y="4.5" width="3.25" height="3"/><rect x="9.25" y="7.5" width="3.25" height="3"/><rect x="15.75" y="7.5" width="3.25" height="3"/><rect x="6" y="10.5" width="3.25" height="3"/><rect x="12.5" y="10.5" width="3.25" height="3"/></g></svg></div>
      <h2>타이틀 레이스</h2>
    </a>
    <a class="card" href="data/history.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M8 4 H16 V7.5 A4 4 0 0 1 8 7.5 Z"/><path d="M8 4.8 H5.6 A2 2 0 0 0 8 7.4"/><path d="M16 4.8 H18.4 A2 2 0 0 1 16 7.4"/><path d="M12 11.5 V15"/><path d="M10.4 20 L11 15 H13 L13.6 20"/><path d="M9 20 H15"/></svg></div>
      <h2>역대 기록</h2>
    </a>
    <a class="card" href="data/today.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M5.6 12.4 C4.6 11.4 4.4 9 6 8.4 C6.2 6.8 6.9 5.9 8 5.9 A1.15 1.15 0 0 1 10.3 6.2 C10.4 5.4 11 4.7 12 4.7 A1.15 1.15 0 0 1 14.1 5.1 C14.3 4.6 15 4.3 15.9 4.6 C17.1 5 17.6 6.3 17.6 7.8 C18.7 8.9 18.9 11.5 18 13.4 C17.3 17.4 14.6 19.7 12 19.7 C8.9 19.7 6.4 17.4 6 13.8 C5.85 13.2 5.7 13 5.6 12.4 Z"/><path d="M6.8 9 L8.6 10.8" stroke-width="1.2"/><path d="M7.6 8.2 L9.2 9.8" stroke-width="1.2"/><circle class="fill" cx="12.2" cy="13.9" r="2.7"/></svg></div>
      <h2>오늘의 승부</h2>
    </a>
    <a class="card" href="data/predictions.html">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9.2 4.5 V3.4 A1.1 1.1 0 0 1 10.3 2.3 H13.7 A1.1 1.1 0 0 1 14.8 3.4 V4.5 Z"/><polyline points="8.5,13 11,15.5 15.5,10"/></svg></div>
      <h2>예측 성적표</h2>
    </a>
  </div>
  <div class="foot">
    <b>자료 출처</b> · 네이버 야구(경기 기록) · KBO Talent(kbostuff.app, 트래킹 지표) · 스태티즈 Statiz(WAR·세부 기록)<br>
    이 페이지는 <b>취미·학습 목적의 개인 세이버매트릭스 프로젝트</b>입니다. 상업적 이용을 하지 않으며, 상업적으로 이용할 수 없습니다.<br>
    모든 데이터의 권리는 각 출처에 있습니다.
  </div>
  <div class="tag tag-bottom"><span class="cl">숫자로 재고,</span> <span class="cl">예보로 앞서고,</span> <span class="cl">기록은 남긴다</span></div>
  <script>
    // 빌드가 남긴 실제 갱신 시각(data/last_updated.json)을 읽어 표시.
    // 없으면(첫 빌드 전 등) 조용히 생략.
    fetch('data/last_updated.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (d && d.stamp) {
          const latest = d.latest ? ' · ' + d.latest + ' 경기까지 반영' : '';
          document.getElementById('lastUpdated').textContent =
            '🕗 최종 갱신 ' + d.stamp + latest;
        }
      })
      .catch(() => {});

    // 부제 앞 아이콘 순환: 치킨 → 맥주 → 계산 (계속 스위칭)
    (function () {
      const cyc = document.getElementById('cyc');
      if (!cyc) return;
      const icons = ['🍗', '🍺', '🔢'];
      let i = 0;
      setInterval(function () {
        i = (i + 1) % icons.length;
        cyc.style.opacity = '0';
        cyc.style.transform = 'scale(.55) rotate(-12deg)';
        setTimeout(function () {
          cyc.textContent = icons[i];
          cyc.style.opacity = '1';
          cyc.style.transform = 'scale(1) rotate(0)';
        }, 200);
      }, 1400);
    })();
  </script>
</body>
</html>
