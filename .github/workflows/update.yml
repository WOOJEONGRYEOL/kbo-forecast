name: KBO 대시보드 자동 갱신

# 매일 오전 6시(KST) — GitHub Actions는 UTC 기준이라 21:00 UTC = 다음날 06:00 KST
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # GitHub 화면에서 수동 실행 버튼도 제공

permissions:
  contents: write         # 갱신된 HTML을 저장소에 커밋하려면 쓰기 권한 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 경기 데이터(월별 게임·박스스코어·로고)를 실행 사이에 재사용해
      # 매번 수백 경기를 새로 받지 않도록 캐시합니다.
      - name: 데이터 캐시
        uses: actions/cache@v4
        with:
          path: data
          key: kbo-data-${{ github.run_id }}
          restore-keys: kbo-data-

      # 누적·권위 파일(예측 로그 등)은 캐시가 아니라 git(원격) 기준으로 되돌린다.
      #   actions/cache가 stale한 data/predictions.json을 덮어써, 그날 슬레이트에 없는
      #   과거 날짜(예: 10-05) 예측·결과가 통째로 유실·퇴행되던 버그 방지.
      - name: 누적 파일 git 기준 복원
        run: git checkout HEAD -- data/predictions.json data/predictions.html data/last_updated.json 2>/dev/null || true

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행 (데이터 갱신 + 대시보드 재생성)
        run: |
          python main.py
          python players.py

      - name: 갱신된 대시보드 커밋 & 푸시
        run: |
          git config user.name "kbo-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/dashboard.html data/players.html data/today.html data/last_updated.json data/predictions.json data/predictions.html data/title_race.json data/title_race.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 대시보드 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
