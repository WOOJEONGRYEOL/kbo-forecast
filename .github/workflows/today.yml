name: 오늘의 기대 스코어 (라인업 반영)

# 오늘의 경기(today.html)·예측 성적표(predictions.html)를 자주 갱신하는 경량 빌드.
# KST = UTC+9. 13:00~00:45 KST 전 구간을 매 15분으로 촘촘히 커버한다:
#   · 13:00~19:45 — 확정 타순(경기 ~45분 전) 발표 직후 예측 반영
#   · 20:00~00:45 — 경기 종료(~22:00, 연장 포함) 후 실제 결과·적중 backfill
# GitHub cron은 5~20분 지연/누락될 수 있어 15분 간격으로 돌려 한 번은 제때 잡는다
#   (각 실행 ~30초, 공개 저장소 무료).
on:
  schedule:
    # 13:00~00:45 KST 매 15분 = 04:00~15:45 UTC (저녁 공백 없이 연속).
    - cron: "0,15,30,45 4-15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 겹치는 실행 방지(앞 런이 밀려도 충돌 없이 순차 처리)
concurrency:
  group: today-score
  cancel-in-progress: false

jobs:
  today:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 무거운 데이터(박스스코어 캐시·타자 wRC+ CSV)를 매일 빌드가 남긴 캐시에서
      # 복원만 한다(저장 안 함 → 캐시 난립 방지). 없으면 타순 배수는 1.0으로 degrade.
      - name: 데이터 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-data-restore
          restore-keys: kbo-data-

      # 캐시(path: data)는 '렌더 입력 데이터'(월별 경기·박스스코어·CSV)만 재사용하려는 것인데
      #   data/ 통째라 렌더된 HTML까지 stale하게 복원된다. GH는 네이버(해외 IP) 차단으로 today.py가
      #   가드에 걸려 라이브 페이지를 재생성하지 않으므로, 복원된 stale HTML이 그대로 커밋돼 로컬
      #   빌더의 신버전을 덮는다(네비/승률바/포스트시즌 오락가락의 근본 원인). 그래서 라이브 페이지와
      #   누적·권위 파일은 캐시가 아니라 git(원격) HEAD 기준으로 되돌린다 — today.py가 실제로
      #   새로 생성한 경우에만 다시 바뀐다(GH에선 안 바뀜 → 로컬 빌더만 갱신).
      - name: 라이브·누적 파일 git 기준 복원 (stale 캐시 HTML 주입 차단)
        run: git checkout HEAD -- data/today.html data/postseason.html data/predictions.json data/predictions.html data/last_updated.json 2>/dev/null || true

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: today.html 재생성 (예고선발·발표 라인업 반영)
        run: python today.py

      - name: 변경 시에만 커밋 & 푸시
        run: |
          git config user.name "kbo-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/today.html data/last_updated.json data/predictions.json data/predictions.html data/postseason.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 오늘의 기대 스코어 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase --autostash -X theirs || true
            git push
          fi
